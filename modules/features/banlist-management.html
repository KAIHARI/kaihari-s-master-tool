<div id="moduleContent">
    <!-- BANLIST MANAGEMENT MODULE -->
    <!--
    This is a fully functional banlist management module.
    When loaded, this module provides banlist modal and management functionality.

    Functions Provided:
    - openBanlistModal() - Opens the banlist management modal
    - closeBanlistModal() - Closes the banlist management modal
    - searchCardsForBanlist(searchTerm) - Searches cards for banlist management
    - saveBanlist() - Saves the custom banlist to localStorage
    - resetBanlist() - Resets all banlist statuses to unlimited

    Usage:
    - Module auto-initializes when loaded
    - Accesses global customBanlist variable
    - Uses advancedSearchState.allCards for card searching
    - Integrates with main UI system
    -->

    <!-- Banlist Management Modal -->
    <div id="banlistModal"
        class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center">
        <div
            class="bg-[var(--color-surface-1) rounded-lg shadow-xl p-6 w-full max-w-4xl mx-4 flex flex-col max-h-[90vh]">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-semibold text-white">Manage Custom Banlist</h3>
                <button id="banlistModalClose"
                    class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>
            <p class="text-sm text-slate-300 mb-4">Search for cards and assign them banlist statuses.</p>
            <div class="relative mb-4">
                <input type="text" id="banlistSearchInput" placeholder="Search for a card..."
                    class="w-full bg-slate-700 border border-[var(--color-border)] rounded-md px-3 py-2 focus:ring-2 focus:ring-[var(--color-primary)] focus:outline-none">
            </div>
            <div id="banlistSearchResults" class="flex-1 overflow-y-auto mb-4 space-y-2 min-h-[400px]">
                <p class="text-center text-slate-400 mt-20">Search for cards to manage their banlist status</p>
            </div>
            <div class="flex justify-end gap-4 border-t border-[var(--color-border)] pt-4">
                <button id="banlistResetBtn"
                    class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-4 rounded-md">Reset All</button>
                <button id="banlistSaveBtn"
                    class="bg-green-600 hover:bg-green-700 text-white font-bold py-2 px-4 rounded-md">Save &
                    Close</button>
            </div>
        </div>
    </div>
</div>

<script>
(function() {
    'use strict';

    console.log('Banlist management module initializing...');

    // Access global state from main HTML
    const getCustomBanlist = () => {
        if (typeof customBanlist !== 'undefined') {
            return customBanlist;
        }
        // Initialize if not exists
        if (typeof window.customBanlist === 'undefined') {
            window.customBanlist = {};
        }
        return window.customBanlist;
    };

    const setCustomBanlist = (value) => {
        window.customBanlist = value;
        if (typeof customBanlist !== 'undefined') {
            // Update reference if it exists in global scope
            Object.assign(customBanlist, value);
        }
    };

    const getAdvancedSearchState = () => {
        if (typeof advancedSearchState !== 'undefined') {
            return advancedSearchState;
        }
        return { allCards: [] };
    };

    // Helper function to show tooltip
    function showTooltip(message) {
        if (typeof window.showTooltip === 'function') {
            window.showTooltip(message);
        } else if (typeof showTooltip === 'function') {
            showTooltip(message);
        } else {
            console.log('Banlist Manager:', message);
        }
    }

    // Helper function to show message
    function showMessage(message) {
        if (typeof window.showMessage === 'function') {
            window.showMessage(message);
        } else if (typeof showMessage === 'function') {
            showMessage(message);
        } else {
            console.log('Banlist Manager:', message);
        }
    }

    // --- BANLIST MANAGEMENT FUNCTIONS ---

    window.openBanlistModal = function() {
        const modal = document.getElementById('banlistModal');
        if (!modal) {
            console.error('Banlist modal element not found');
            return;
        }
        modal.classList.remove('hidden');

        const searchInput = document.getElementById('banlistSearchInput');
        const searchResults = document.getElementById('banlistSearchResults');

        if (searchInput) searchInput.value = '';
        if (searchResults) {
            searchResults.innerHTML = '<p class="text-center text-slate-400 mt-20">Search for cards to manage their banlist status</p>';
        }
    };

    window.closeBanlistModal = function() {
        const modal = document.getElementById('banlistModal');
        if (!modal) {
            console.error('Banlist modal element not found');
            return;
        }
        modal.classList.add('hidden');
    };

    window.searchCardsForBanlist = function(searchTerm) {
        const searchResults = document.getElementById('banlistSearchResults');
        if (!searchResults) {
            console.error('Banlist search results element not found');
            return;
        }

        if (!searchTerm || searchTerm.length < 2) {
            searchResults.innerHTML = '<p class="text-center text-slate-400 mt-20">Enter at least 2 characters to search</p>';
            return;
        }

        const searchState = getAdvancedSearchState();
        const allCards = searchState.allCards || [];

        const searchLower = searchTerm.toLowerCase();
        const matches = allCards.filter(card =>
            card.name && card.name.toLowerCase().includes(searchLower)
        ).slice(0, 50); // Limit to 50 results

        searchResults.innerHTML = '';

        if (matches.length === 0) {
            searchResults.innerHTML = '<p class="text-center text-slate-400">No cards found</p>';
            return;
        }

        const currentBanlist = getCustomBanlist();

        matches.forEach(card => {
            const cardEl = document.createElement('div');
            cardEl.className = 'p-3 flex items-center justify-between bg-[var(--color-surface-2)]/50 rounded-lg';

            const currentStatus = currentBanlist[card.id] || 'unlimited';

            cardEl.innerHTML = `
                <div class="flex items-center gap-3 overflow-hidden">
                    <img src="${card.imageUrlSmall}" class="w-10 h-auto rounded-md flex-shrink-0" onerror="this.onerror=null;this.src='https://placehold.co/40x56/2d3748/e2e8f0?text=?';">
                    <span class="text-sm font-medium">${card.name}</span>
                </div>
                <select data-card-id="${card.id}" class="banlist-status-select bg-slate-700 border border-[var(--color-border)] rounded-md px-2 py-1 text-sm">
                    <option value="unlimited" ${currentStatus === 'unlimited' ? 'selected' : ''}>Unlimited</option>
                    <option value="semi-limited" ${currentStatus === 'semi-limited' ? 'selected' : ''}>Semi-Limited</option>
                    <option value="limited" ${currentStatus === 'limited' ? 'selected' : ''}>Limited</option>
                    <option value="forbidden" ${currentStatus === 'forbidden' ? 'selected' : ''}>Forbidden</option>
                </select>
            `;

            const select = cardEl.querySelector('select');
            select.addEventListener('change', (e) => {
                const banlist = getCustomBanlist();
                banlist[card.id] = e.target.value;
                setCustomBanlist(banlist);
            });

            searchResults.appendChild(cardEl);
        });
    };

    window.saveBanlist = function() {
        try {
            const banlist = getCustomBanlist();
            localStorage.setItem('customBanlist', JSON.stringify(banlist));
            showTooltip('Banlist saved successfully');
            closeBanlistModal();
        } catch (e) {
            console.error('Error saving banlist:', e);
            showMessage('Failed to save banlist');
        }
    };

    window.resetBanlist = function() {
        if (confirm('Are you sure you want to reset all banlist statuses to unlimited?')) {
            setCustomBanlist({});
            localStorage.removeItem('customBanlist');
            showTooltip('Banlist reset successfully');

            const searchInput = document.getElementById('banlistSearchInput');
            const searchResults = document.getElementById('banlistSearchResults');

            if (searchInput) searchInput.value = '';
            if (searchResults) {
                searchResults.innerHTML = '<p class="text-center text-slate-400 mt-20">Search for cards to manage their banlist status</p>';
            }
        }
    };

    // --- EVENT HANDLERS ---

    function setupEventListeners() {
        // Modal close button
        const closeModalBtn = document.getElementById('banlistModalClose');
        if (closeModalBtn) {
            closeModalBtn.addEventListener('click', window.closeBanlistModal);
        }

        // Save button
        const saveBtn = document.getElementById('banlistSaveBtn');
        if (saveBtn) {
            saveBtn.addEventListener('click', window.saveBanlist);
        }

        // Reset button
        const resetBtn = document.getElementById('banlistResetBtn');
        if (resetBtn) {
            resetBtn.addEventListener('click', window.resetBanlist);
        }

        // Search input
        const searchInput = document.getElementById('banlistSearchInput');
        if (searchInput) {
            searchInput.addEventListener('input', (e) => {
                window.searchCardsForBanlist(e.target.value.trim());
            });
        }

        // Close modal on escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modal = document.getElementById('banlistModal');
                if (modal && !modal.classList.contains('hidden')) {
                    window.closeBanlistModal();
                }
            }
        });

        // Close modal on backdrop click
        const modal = document.getElementById('banlistModal');
        if (modal) {
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    window.closeBanlistModal();
                }
            });
        }

        console.log('Banlist management event listeners setup complete');
    }

    // --- MODULE INITIALIZATION ---

    async function initialize() {
        console.log('Banlist management module initializing...');

        try {
            // Load saved banlist from localStorage
            const savedBanlist = localStorage.getItem('customBanlist');
            if (savedBanlist) {
                try {
                    const parsed = JSON.parse(savedBanlist);
                    setCustomBanlist(parsed);
                    console.log('Loaded custom banlist with', Object.keys(parsed).length, 'entries');
                } catch (e) {
                    console.error('Error parsing saved banlist:', e);
                }
            }

            setupEventListeners();
            console.log('Banlist management module initialized successfully');
        } catch (error) {
            console.error('Error initializing banlist management module:', error);
        }
    }

    // Initialize module
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initialize);
    } else {
        initialize();
    }

})();
</script>
