name: Release APK

# Publishes a signed APK as a GitHub release. The in-app updater reads the
# latest release from the public API and installs the .apk asset attached here,
# so the asset name and the tag are part of the contract.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1'
        required: true
        type: string
      prerelease:
        description: 'Mark as a pre-release (stable installs will ignore it)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # versionCode is derived from the commit count, which needs history.
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          NAME="${RAW#v}"

          # versionCode must increase monotonically or Android refuses the
          # update. Commit count does that automatically and reproducibly.
          CODE="$(git rev-list --count HEAD)"

          echo "name=$NAME"   >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME"   >> "$GITHUB_OUTPUT"
          echo "code=$CODE"   >> "$GITHUB_OUTPUT"
          echo "Releasing v$NAME (versionCode $CODE)"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build signed release APK
        working-directory: app
        run: |
          ./gradlew :androidApp:assembleRelease \
            -Pmastertool.versionName=${{ steps.version.outputs.name }} \
            -Pmastertool.versionCode=${{ steps.version.outputs.code }} \
            --stacktrace

      - name: Name the APK after the release
        id: apk
        run: |
          set -euo pipefail
          SRC="$(find app/androidApp/build/outputs/apk/release -name '*.apk' | head -1)"
          DEST="kai-master-tool-${{ steps.version.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      - name: Verify the signing certificate
        env:
          # SHA-256 of the signing *certificate* in
          # androidApp/keystore/kai-master-tool.jks -- not of the file, which is a
          # different number and does not appear anywhere in this check. Read it
          # with `keytool -list -v -keystore ... -alias kai-master-tool`. A
          # release signed with anything else cannot install over an existing
          # copy, so this is a hard gate rather than a warning.
          EXPECTED_SHA256: 0bb9cc076e3ac23330e27c87711ec34ca917d8c2471385c6a6b550e1301cb22c
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "${{ steps.apk.outputs.path }}" | tee certs.txt

          # Normalised so colons or upper-case hex cannot cause a false failure.
          NORMALISED="$(tr -d ':' < certs.txt | tr 'A-Z' 'a-z')"
          if ! grep -q "$EXPECTED_SHA256" <<< "$NORMALISED"; then
            echo "::error::APK is not signed with the committed release key"
            exit 1
          fi
          echo "Signing certificate verified."

      # Kept the signed APK before trying to publish it, not after. Publishing
      # is the step that can fail for reasons that have nothing to do with the
      # build -- a token without permission to write releases, most of all --
      # and a six-minute compile should not be thrown away by one of them.
      - uses: actions/upload-artifact@v4
        with:
          name: kai-master-tool-release-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          PRERELEASE=""
          if [ "${{ inputs.prerelease }}" = "true" ]; then PRERELEASE="--prerelease"; fi

          # A release number names one commit, and reusing it for different code
          # would leave the tag where it was pointed while the .apk underneath it
          # changed -- and the updater trusts the tag. Checked whenever the tag
          # exists at all, because an existing tag also silently overrides the
          # --target below.
          #
          # Asked for the commit rather than the ref so an annotated tag resolves
          # too: that ref answers with the tag object's own SHA, which never
          # equals a commit and would fail every legitimate re-run.
          if AT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha' 2>/dev/null)"; then
            if [ "$AT" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG already exists at $AT, which is not the commit this run built ($GITHUB_SHA). Release under a new version instead."
              exit 1
            fi
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            # --target is the commit this run built, not the default branch.
            # Without it `gh release create` tags whatever main happens to be,
            # while `actions/checkout` has already built the *dispatched* ref --
            # so a release triggered from any branch but the default one shipped
            # an APK whose code was not the code its own tag pointed at.
            if ! gh release create "$TAG" "$APK" \
              --target "$GITHUB_SHA" \
              --title "kai's master tool $TAG" \
              --generate-notes \
              $PRERELEASE
            then
              # A 403 here has been transient at least once, on a run whose very
              # next attempt published the same version from the same commit. The
              # signed APK is already attached to this run as an artifact, so
              # re-dispatching costs a retry and not a build -- and the tag check
              # above is what makes re-dispatching the same version safe.
              echo "::error::Could not publish $TAG. The signed APK is attached to this run as an artifact; re-dispatch the same version at the same commit to retry publishing."
              exit 1
            fi
          fi
