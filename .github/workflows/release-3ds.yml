name: Release CIA

# Publishes the 3DS build as a GitHub release. This is a **separate track from
# the Android APK** and shares nothing with `release.yml` except the repository.
#
# ## The tag namespace is the separation
#
# Android releases are tagged `v1.2.3`. These are tagged `3ds-v1.0.0`, and the
# prefix is not decoration: GitHub's `/releases/latest` returns the most recent
# non-prerelease release of *any* tag shape, and the Android app's in-app
# updater reads exactly that endpoint. A 3DS release therefore lands in front of
# the Android updater whether anyone wants it to or not, and `AppVersion.parse`
# is what has to tell them apart. It does now; before it did, `3ds-v1.0.0` read
# as *major version 3* — newer than any APK ever shipped, carrying no APK to
# install, and shadowing the real Android release published before it.
#
# So: never tag a 3DS release `v*`, and never tag an Android release `3ds-v*`.
#
# ## And every 3DS release is published as a pre-release
#
# Unconditionally, which is why it is not an input. `AppVersion.parse` only
# protects a device that *has* it, and the device that most needs protecting is
# the one still running the build from before the fix — which cannot update,
# because the thing shadowing its update is the release doing the shadowing.
# 3ds-v1.0.0 shipped without the flag and did exactly that: it took the repo's
# "Latest" from v1.2.62 five minutes after v1.2.62 published it.
#
# `prerelease` is the only mechanism whose exclusion from `/releases/latest` is
# in the endpoint's own documented definition rather than inferred from how the
# "Latest" label behaves, and it costs nothing here: nothing reads that endpoint
# for the 3DS, because a `.cia` is installed by hand with FBI. It also trips
# `UpdateChecker`'s own skip-pre-releases rule, so the two guards are
# independent. The label is explained in the release notes so it does not read
# as "unfinished".
#
# ## The two permanent numbers
#
# The CIA's title version comes from the tag and must only ever increase, or FBI
# reads an install as a downgrade and refuses it. The UniqueId in `3ds/app.rsf`
# is fixed forever and is not settable here on purpose — a different UniqueId is
# a different app to the HOME menu, with the first one's data orphaned.

on:
  push:
    tags:
      - '3ds-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.0.1 (tagged 3ds-v1.0.1)'
        required: true
        type: string
      republish:
        description: 'Re-publish the version that is already the newest tag (metadata fixes)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-3ds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build the CIA
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest
    defaults:
      run:
        shell: bash
    outputs:
      name: ${{ steps.version.outputs.name }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Every 3ds-v tag, so the monotonicity gate below can see them.
          fetch-depth: 0

      - name: Resolve and gate the version
        id: version
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$PWD"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          NAME="${RAW#3ds-v}"
          NAME="${NAME#v}"

          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$NAME' is not major.minor.micro. The CIA title version is three numbers."
            exit 1
          fi

          # A published title version is spent forever: the console refuses an
          # install whose version is not greater than the one already there, so
          # a number that goes backwards is a build nobody can install over.
          PREV="$(git tag -l '3ds-v*' | sed 's/^3ds-v//' \
                  | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)"
          if [ -n "$PREV" ]; then
            HIGHEST="$(printf '%s\n%s\n' "$PREV" "$NAME" | sort -V | tail -1)"
            if [ "$HIGHEST" != "$NAME" ]; then
              echo "::error::$NAME does not come after the last released $PREV."
              exit 1
            fi
            # Equal is a re-run rather than a downgrade, and the publish step
            # has always had a branch for one - it re-uploads over an existing
            # release. That branch was unreachable, because this rejected the
            # only version that could get to it. It is reachable now, and asked
            # for explicitly, so a re-run stays a decision rather than a typo.
            if [ "$NAME" = "$PREV" ] && [ "${{ inputs.republish }}" != "true" ]; then
              echo "::error::$NAME is already released. Pass republish=true to publish over it."
              exit 1
            fi
          fi

          echo "name=$NAME"        >> "$GITHUB_OUTPUT"
          echo "tag=3ds-v$NAME"    >> "$GITHUB_OUTPUT"
          echo "Releasing 3ds-v$NAME (previous: ${PREV:-none})"

      - name: Tools for the CIA step
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            cmake build-essential git curl unzip \
            libpng-dev zlib1g-dev libogg-dev libvorbis-dev
          3ds/tools/fetch-cia-tools.sh /opt/cia-tools
          echo "/opt/cia-tools" >> "$GITHUB_PATH"

      - name: Build
        run: |
          set -o pipefail
          # The Makefile takes the title version from this file. Written, not
          # committed: the tag is the record of what shipped.
          echo "${{ steps.version.outputs.name }}" > 3ds/VERSION

          # Both targets, because they are independent: `all` makes the .3dsx
          # and `cia` makes the .cia, and neither is a prerequisite of the
          # other. Asking only for `cia` produced a perfectly good .cia and no
          # .3dsx at all, which the assertions below then reported as a failed
          # build - after the whole thing had compiled and linked.
          #
          # `build-3ds.yml` never caught it because it runs the two as separate
          # steps on purpose, to tell a code failure from a packaging one. That
          # is worth keeping there; what it means is that the CI path and the
          # release path are two different invocations, and this is the one
          # nothing exercises until a release is dispatched.
          make -C 3ds all cia 2>&1 | tee 3ds/build-release.log

          test -f 3ds/kai-master-tool.cia  || { echo "::error::no .cia produced";  exit 1; }
          test -f 3ds/kai-master-tool.3dsx || { echo "::error::no .3dsx produced"; exit 1; }

          cp 3ds/kai-master-tool.cia  "kai-master-tool-${{ steps.version.outputs.name }}.cia"
          cp 3ds/kai-master-tool.3dsx "kai-master-tool-${{ steps.version.outputs.name }}.3dsx"
          ls -l kai-master-tool-*

      - uses: actions/upload-artifact@v4
        with:
          name: kai-master-tool-3ds-release
          path: |
            kai-master-tool-*.cia
            kai-master-tool-*.3dsx
          if-no-files-found: error

  # Publishing is a second job on a normal runner rather than a step in the
  # first, because the devkitPro container has no `gh` and the alternative was
  # a python program nested inside a shell string inside a YAML block scalar -
  # three levels of quoting for something the CLI does in one line.
  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: kai-master-tool-3ds-release

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          NAME: ${{ needs.build.outputs.name }}
        run: |
          set -euo pipefail
          ls -l kai-master-tool-*

          NOTES=$(mktemp)
          {
            echo "kai's master tool for the New 3DS, $TAG."
            echo
            echo "Install \`kai-master-tool-$NAME.cia\` with FBI."
            echo
            echo "The \`.3dsx\` is for the Homebrew Launcher, but the \`.cia\` is the"
            echo "real build: a \`.3dsx\` inherits its host title's permissions and a"
            echo "\`.cia\` gets only what its own RSF grants, so a missing service shows"
            echo "up in one and not the other."
            echo
            echo "This is the 3DS track. It is unrelated to the Android \`v*\` releases."
            echo
            echo "**It is marked a pre-release on purpose, and it is not unfinished.**"
            echo "GitHub's \`/releases/latest\` hands back the newest *non*-pre-release of"
            echo "any tag shape, and the Android app's updater reads exactly that."
            echo "Without the flag a 3DS release becomes the repo's \"Latest\" and every"
            echo "tablet asks it for an APK it does not have. Nothing reads that endpoint"
            echo "for the 3DS - a \`.cia\` is installed by hand - so the flag costs the"
            echo "console nothing."
          } > "$NOTES"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Metadata first: a re-publish is usually here to fix exactly this.
            gh release edit "$TAG" --prerelease --notes-file "$NOTES"
            gh release upload "$TAG" kai-master-tool-*.cia kai-master-tool-*.3dsx --clobber
          else
            gh release create "$TAG" kai-master-tool-*.cia kai-master-tool-*.3dsx \
              --title "kai's master tool for 3DS $TAG" \
              --notes-file "$NOTES" \
              --prerelease
          fi
